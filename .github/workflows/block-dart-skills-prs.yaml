name: Block Upstream Skill Modifications

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # Triggers if any file inside folders prefixed with "dart-" is modified
      - 'skills/dart-**'

jobs:
  prevent-modifications:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Skip the block check ONLY if the PR is originating from the sync branch on the main repository.
    if: |
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.head.ref != 'automation/sync-dart-skills'
    steps:
      - name: Fail Action and Record Summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await core.summary
              .addHeading('DO NOT modify these files!', 2)
              .addRaw('The files within `skills/dart-*` are **automatically synchronized** from the upstream [dart-lang/skills](https://github.com/dart-lang/skills) repository.\n\n')
              .addRaw('Please close this Pull Request and submit your changes to the [upstream repository](https://github.com/dart-lang/skills) instead. Once merged upstream, your updates will be automatically brought over here.')
              .write();

            core.setFailed('Direct changes to synced Dart skills are prohibited in this repository. Submit changes to https://github.com/dart-lang/skills instead.');
