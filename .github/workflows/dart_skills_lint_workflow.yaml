name: dart_skills_lint
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'tool/dart_skills_lint/**'
      - '.github/workflows/dart_skills_lint_workflow.yaml'
  push:
    branches: [ main ]
    paths:
      - 'skills/**'
      - 'tool/dart_skills_lint/**'
      - '.github/workflows/dart_skills_lint_workflow.yaml'
  schedule:
    - cron: '0 0 * * 0' # weekly

defaults:
  run:
    working-directory: tool/dart_skills_lint

jobs:
  analyze_and_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable

      - run: dart pub get

      - run: dart analyze --fatal-infos

      - name: Run cognitive complexity check
        run: dart run cognitive_complexity --fail-threshold 48 lib test

      - run: dart test

      - name: Verify API boundary runner example
        run: |
          cd example/api_boundary_runner
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos .
          dart run bin/main.dart

  coverage:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@75f342c5d0b8c8adde3a2b7ea101e7e47897d1fc # v1
    with:
      working_directory: tool/dart_skills_lint
      min_coverage: 73
      coverage_excludes: '**/*.g.dart'

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable

      - run: dart pub get

      - run: dart format --output=none --set-exit-if-changed .

  pana_score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable

      - run: dart pub get

      - name: Install pana
        run: dart pub global activate pana

      # pana --exit-code-threshold N fails the step when
      # (max - granted) > N. Threshold 0 means any point drop fails;
      # current package score is 160/160 and we want to keep it there.
      - name: Pana score gate (160/160 required)
        run: dart pub global run pana --no-warning --exit-code-threshold 0 .
